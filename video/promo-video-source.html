<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Doxha Church — Promo</title>
<link rel="stylesheet" href="../css/devices.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url('fonts/Inter-Variable.woff2') format('woff2-variations'), url('fonts/Inter-Variable.woff2') format('woff2');
  }
  html, body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; font-family: 'Inter', -apple-system, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif; }
  * { box-sizing: border-box; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; }

  .scene {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    opacity:0; transition: opacity .5s ease; overflow:hidden;
  }
  .scene.active { opacity:1; z-index:2; }
  .scene.bg-paper { background:#fbfcff; }
  .scene.bg-sky {
    background: linear-gradient(120deg, #d8e6fb 0%, #e4eefd 22%, #d2e2fb 45%, #dfebfd 68%, #d8e6fb 100%);
    background-size: 320% 320%;
  }
  .scene.active.bg-sky { animation: bgFlow 26s ease-in-out infinite; }
  @keyframes bgFlow {
    0%   { background-position: 0% 45%; }
    50%  { background-position: 100% 55%; }
    100% { background-position: 0% 45%; }
  }
  /* subtle film-grain texture over every scene, so nothing reads as a flat digital gradient */
  #grain {
    position:absolute; inset:-50%; z-index:4; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
    animation: grainShift 1.1s steps(6) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0,0); }
    20%  { transform: translate(-2%,-1%); }
    40%  { transform: translate(1%,2%); }
    60%  { transform: translate(-1%,1%); }
    80%  { transform: translate(2%,-2%); }
    100% { transform: translate(0,0); }
  }

  .scene-cam { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .scene.active .scene-cam { animation: camBreathe 6s ease-in-out infinite alternate; }
  @keyframes camBreathe { from { transform: scale(1) translateY(0); } to { transform: scale(1.015) translateY(-5px); } }

  .sparkle { display:inline-block; width:.62em; height:.62em; vertical-align:.02em; }
  .sparkle svg { width:100%; height:100%; }

  /* ---- typewriter: smooth, continuous, natural ---- */
  .typewrite { font-weight: 600; text-align:center; }
  .tw-cursor { display:inline-block; width:3px; margin-left:2px; vertical-align:-.06em; animation: twBlink .9s steps(1) infinite; background:#3457e8; }
  @keyframes twBlink { 50% { opacity:0; } }
  .tw-accent { background:linear-gradient(135deg,#3457e8,#2fe3c4); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }

  .line-big { font-size:64px; font-weight:600; letter-spacing:-.02em; line-height:1.35; max-width:1500px; }
  .line-big.on-light { color:#141b3a; }
  .line-sub { font-size:28px; font-weight:500; margin-top:6px; }
  .line-sub.on-light { color:#5b6274; }
  .line-mid { font-size:40px; font-weight:600; letter-spacing:-.015em; text-align:center; }
  .line-mid.on-light { color:#141b3a; }

  .brand-row { display:flex; align-items:center; gap:22px; opacity:0; transform:scale(.85); }
  .brand-row.in { animation: brandIn .6s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes brandIn { to { opacity:1; transform:scale(1); } }
  .brand-mark-lg { width:104px; height:104px; border-radius:28px; background:linear-gradient(135deg,#5c7cf2,#0a0d1c 120%); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:52px; box-shadow:0 30px 70px rgba(33,64,201,.45); position:relative; }
  .spark-badge { position:absolute; top:-14px; right:-14px; width:34px; height:34px; color:#2fe3c4; filter:drop-shadow(0 4px 10px rgba(47,227,196,.5));
    opacity:0; transform:scale(.3) rotate(-30deg); }
  .spark-badge.in { animation: sparkIn .5s cubic-bezier(.2,1.6,.3,1) forwards, sparkSpin 5s linear .5s infinite; }
  @keyframes sparkIn { to { opacity:1; transform:scale(1) rotate(0deg); } }
  @keyframes sparkSpin { to { transform:scale(1) rotate(360deg); } }
  .wordmark { font-size:60px; font-weight:800; letter-spacing:-.02em; color:#141b3a; }
  .cta-line { margin-top:26px; font-size:22px; letter-spacing:.02em; opacity:0; }
  .cta-line.in { animation: fadeUp .6s ease forwards; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ---- shared "real product" UI kit ---- */
  .app-screen { position:relative; grid-area:1/1; width:1000px; background:rgba(255,255,255,.62); backdrop-filter:blur(24px) saturate(1.7); -webkit-backdrop-filter:blur(24px) saturate(1.7); border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,.55);
    box-shadow: 0 70px 130px rgba(20,32,80,.24), 0 30px 70px rgba(52,87,232,.14), inset 0 1px 0 rgba(255,255,255,.6);
    animation: screenPush 4s cubic-bezier(.22,.08,.32,1) forwards; transform-origin:52% 46%; }
  .screen-slot { display:grid; justify-items:center; align-items:start; }
  @keyframes screenPush {
    from { transform: perspective(1700px) rotateX(4deg) rotateY(-3.2deg) scale(1); }
    to   { transform: perspective(1700px) rotateX(2deg) rotateY(-1.2deg) scale(1.07); }
  }

  /* fake cursor: a small moving pointer, shared across scenes, for the sense of a live demo */
  .fake-cursor { position:absolute; width:16px; height:16px; z-index:5; opacity:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); transition: left 1.1s cubic-bezier(.4,0,.2,1), top 1.1s cubic-bezier(.4,0,.2,1), opacity .3s ease; }
  .fake-cursor.show { opacity:1; }
  .fake-cursor svg { width:100%; height:100%; }
  .click-ring { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; border:2px solid #3457e8; opacity:0; pointer-events:none; z-index:4; }
  .click-ring.ping { animation: clickPing .5s ease-out forwards; }
  @keyframes clickPing { 0%{opacity:.7; transform:scale(.3);} 100%{opacity:0; transform:scale(1.6);} }
  .app-top { padding:24px 32px 18px; border-bottom:1px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:space-between; }
  .app-title { font-size:24px; font-weight:800; color:#141b3a; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .app-title .sparkle { color:#2140c9; width:22px; height:22px; }
  .app-cta { background:linear-gradient(135deg,#3457e8,#2fe3c4); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:10px; white-space:nowrap; }
  .app-tabs { display:flex; gap:22px; font-size:13px; font-weight:600; color:#9aa1b3; }
  .app-tabs span.active { color:#141b3a; }
  .app-body { padding:24px 32px 30px; }

  .search-bar { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 14px; margin-bottom:16px; width:270px; }
  .search-bar svg { width:16px; height:16px; color:#9aa1b3; flex:none; }
  .search-bar .sb-text { font-size:14px; color:#141b3a; font-weight:600; min-height:1.2em; }
  .search-bar .sb-cursor { display:inline-block; width:2px; height:1em; background:#3457e8; margin-left:1px; vertical-align:-2px; animation: twBlink .9s steps(1) infinite; }
  .row.dim { opacity:.4; }
  .row.hit { background:#f0f4ff; margin:0 -14px; padding:12px 14px; border-radius:8px; }

  .avatar { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; flex:none; }
  .avatar.sm { width:24px; height:24px; border-radius:8px; font-size:11px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:4px 9px; border-radius:6px; }
  .pill-status { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .pill-status .dot { width:6px; height:6px; border-radius:50%; }

  .stat-row { display:flex; gap:14px; margin-bottom:20px; }
  .stat-card { flex:1; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; padding:15px 17px; }
  .stat-num { font-size:24px; font-weight:800; color:#141b3a; }
  .stat-lbl { font-size:12px; color:#8a92a6; font-weight:600; margin-top:3px; }
  .stat-delta { font-size:11px; font-weight:700; color:#0d9488; margin-top:4px; }

  .row-list .row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.45); }
  .row-list .row:last-child { border-bottom:none; }
  .row-name { font-size:14px; font-weight:700; color:#141b3a; flex:1; }
  .row-sub { font-size:12px; color:#9aa1b3; width:140px; }

  .event-card { display:flex; gap:16px; align-items:center; padding:13px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; margin-bottom:11px; }
  .event-date { width:54px; height:54px; border-radius:12px; background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.6); display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .event-date .d { font-size:19px; font-weight:800; color:#141b3a; line-height:1; }
  .event-date .m { font-size:9px; font-weight:700; color:#8a92a6; text-transform:uppercase; }
  .event-title { font-size:15px; font-weight:700; color:#141b3a; }
  .event-meta { font-size:12px; color:#9aa1b3; margin-top:3px; }

  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:15px; }
  .chip { font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; background:#eef1fb; color:#2140c9; }
  .channel-row { display:flex; gap:12px; margin-bottom:18px; }
  .channel-pill { display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:10px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); font-size:12px; font-weight:700; color:#3a4152; }
  .channel-pill svg { width:15px; height:15px; }
  .channel-pill.on { background:#e9f9f5; border-color:#c7f0e6; color:#0d9488; }
  .compose-box { background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; padding:17px; font-size:13px; color:#5b6274; line-height:1.6; margin-bottom:16px; }

  .insight-card { display:flex; gap:14px; padding:15px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; margin-bottom:11px; }
  .insight-icon { width:36px; height:36px; border-radius:11px; background:#eef1fd; color:#2140c9; display:flex; align-items:center; justify-content:center; flex:none; }
  .insight-icon .sparkle { width:17px; height:17px; }
  .insight-text { font-size:13px; font-weight:600; color:#141b3a; line-height:1.5; }
  .insight-link { font-size:12px; font-weight:700; color:#3457e8; margin-top:4px; }

  /* ---- emergence cards (opening act) ---- */
  .info-card { position:absolute; width:250px; background:rgba(255,255,255,.55); backdrop-filter:blur(16px) saturate(1.6); -webkit-backdrop-filter:blur(16px) saturate(1.6); border:1px solid rgba(255,255,255,.65); border-radius:14px; padding:13px 16px; box-shadow:0 24px 50px rgba(20,32,80,.16); opacity:0; filter:blur(10px); }
  .info-card.in { animation: infoIn .7s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes infoIn { to { opacity:.94; filter:blur(0); } }
  .ic-label { font-size:14px; font-weight:700; color:#141b3a; }
  .ic-sub { font-size:12px; color:#7d8496; font-weight:600; margin-top:2px; }

  /* ---- real iPhone 14 Pro mockup (devices.css), used for the "available on mobile" beat and the final hero shot ---- */
  .device-iphone-14-pro .device-screen { background:#eef4ff; overflow:hidden; padding:0; }
  .phone-rise { opacity:0; transform:translateY(40px) scale(.94); }
  .phone-rise.in { animation: phoneRiseIn .8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes phoneRiseIn { to { opacity:1; transform:translateY(0) scale(1); } }
  .mobile-app { width:390px; height:830px; display:flex; flex-direction:column; padding-top:92px; font-family:'Inter',sans-serif; }
  .mobile-header { display:flex; align-items:center; gap:10px; padding:0 24px 20px; }
  .mobile-mark { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#5c7cf2,#0a0d1c 120%); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:16px; flex:none; }
  .mobile-title { font-size:19px; font-weight:800; color:#141b3a; }
  .mobile-body { padding:0 20px; flex:1; overflow:hidden; }
  .mobile-stat-row { display:flex; gap:10px; margin-bottom:16px; }
  .mobile-stat { flex:1; background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.85); border-radius:14px; padding:14px; }
  .mobile-stat .msn { font-size:20px; font-weight:800; color:#141b3a; }
  .mobile-stat .msl { font-size:11px; color:#8a92a6; font-weight:600; margin-top:2px; }
  .mobile-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(20,32,80,.06); }
  .mobile-row .mrn { font-size:14px; font-weight:700; color:#141b3a; flex:1; }
  .mobile-row .mrs { font-size:11px; color:#9aa1b3; font-weight:600; }
  .mobile-navbar { display:flex; justify-content:space-around; align-items:center; padding:16px 0 30px; border-top:1px solid rgba(20,32,80,.06); background:rgba(255,255,255,.6); margin-top:auto; }
  .mobile-nav-dot { width:22px; height:22px; border-radius:7px; background:#e3eaf9; }
  .mobile-nav-dot.on { background:linear-gradient(135deg,#3457e8,#2fe3c4); }

  .hero-pan { animation: heroPan 9s ease-in-out infinite alternate; }
  @keyframes heroPan { from { transform: translateX(-14px) rotate(-.35deg); } to { transform: translateX(14px) rotate(.35deg); } }

  /* soft color blobs behind glass panels — bigger, staggered, organic drift so the whole
     canvas feels alive rather than a static painted gradient */
  .glass-blobs { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .glass-blobs span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
  .scene.active .glass-blobs span:nth-child(1) { animation: blobDrift1 16s ease-in-out infinite alternate; }
  .scene.active .glass-blobs span:nth-child(2) { animation: blobDrift2 19s ease-in-out infinite alternate; animation-delay:-6s; }
  .scene.active .glass-blobs span:nth-child(3) { animation: blobDrift3 22s ease-in-out infinite alternate; animation-delay:-11s; }
  @keyframes blobDrift1 { from { transform: translate(0,0) scale(1) rotate(0deg); } to { transform: translate(4.5%,-3.5%) scale(1.14) rotate(8deg); } }
  @keyframes blobDrift2 { from { transform: translate(0,0) scale(1) rotate(0deg); } to { transform: translate(-4%,3%) scale(1.1) rotate(-6deg); } }
  @keyframes blobDrift3 { from { transform: translate(0,0) scale(1) rotate(0deg); } to { transform: translate(3%,4%) scale(1.16) rotate(5deg); } }

  #vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 62%, rgba(6,10,30,.14) 100%); }
  #progress { position:absolute; left:0; bottom:0; height:5px; width:0%; z-index:6; background: linear-gradient(90deg,#3457e8,#2fe3c4); }
  #blackout { position:absolute; inset:0; background:#000; opacity:0; z-index:10; pointer-events:none; transition: opacity .7s ease; }
  #blackout.on { opacity:1; }
</style>
</head>
<body>
<div id="stage">

  <!-- SC0 — cold open: logo alone, calm, premium -->
  <section id="sc0" class="scene bg-paper active">
    <div class="scene-cam">
      <div class="brand-row" id="logoIntroBrand" style="margin-top:0;">
        <div class="brand-mark-lg">D</div>
        <div class="wordmark">Doxha Church</div>
      </div>
    </div>
  </section>

  <!-- SC1 — emergence, convergence, reveal (one continuous shot) -->
  <section id="sc1" class="scene bg-sky">
    <div class="glass-blobs">
      <span style="width:460px; height:460px; left:-80px; top:-120px; background:#8fb0ff;"></span>
      <span style="width:420px; height:420px; right:-100px; bottom:-100px; background:#2fe3c4;"></span>
    </div>
    <div id="emergeWrap" style="position:absolute; inset:0;"></div>
    <div class="scene-cam">
      <div id="sc1text" class="typewrite line-big on-light" style="min-height:86px; position:relative; z-index:3;"></div>
    </div>
    <div id="sc1doxha" class="typewrite line-big on-light" style="position:absolute; z-index:3; left:0; right:0; top:500px; text-align:center; max-width:none;"></div>
  </section>

  <!-- SC3 — the connected journey: dashboard → membres → équipes → événements → communication -->
  <section id="sc3" class="scene bg-sky">
    <div class="glass-blobs">
      <span style="width:480px; height:480px; left:-100px; bottom:-140px; background:#3457e8;"></span>
      <span style="width:420px; height:420px; right:-120px; top:-100px; background:#2fe3c4;"></span>
      <span style="width:340px; height:340px; left:30%; top:-180px; background:#8fb0ff;"></span>
    </div>
    <div class="scene-cam">
      <div id="sc3line" class="typewrite line-mid on-light" style="margin-bottom:28px; min-height:52px;"></div>
      <div id="sc3content" class="screen-slot"></div>
    </div>
  </section>

  <!-- SC4 — available on mobile: a real iPhone mockup -->
  <section id="sc4" class="scene bg-sky">
    <div class="glass-blobs">
      <span style="width:440px; height:440px; left:-100px; top:-100px; background:#8fb0ff;"></span>
      <span style="width:400px; height:400px; right:-100px; bottom:-100px; background:#2fe3c4;"></span>
    </div>
    <div class="scene-cam">
      <div id="sc4phone" class="phone-rise" style="transform-origin:center top;"></div>
      <div id="sc4line" class="typewrite line-mid on-light" style="margin-top:26px;"></div>
    </div>
  </section>

  <!-- SC5 — the AI layer -->
  <section id="sc5" class="scene bg-sky">
    <div class="glass-blobs">
      <span style="width:460px; height:460px; left:-90px; top:-110px; background:#3457e8;"></span>
      <span style="width:400px; height:400px; right:-110px; bottom:-110px; background:#2fe3c4;"></span>
    </div>
    <div class="scene-cam">
      <div id="sc5content" class="screen-slot"></div>
    </div>
  </section>

  <!-- SC6 — breathing -->
  <section id="sc6" class="scene bg-sky">
    <div class="scene-cam">
      <div id="sc6text" class="typewrite" style="font-size:54px; font-weight:600; color:#141b3a; text-align:center; letter-spacing:-.01em; min-height:70px;"></div>
    </div>
  </section>

  <!-- SC7 — hero shot: the whole system, connected -->
  <section id="sc7" class="scene bg-sky">
    <div class="glass-blobs">
      <span style="width:460px; height:460px; left:-100px; top:-100px; background:#8fb0ff;"></span>
      <span style="width:420px; height:420px; right:-100px; bottom:-100px; background:#2fe3c4;"></span>
    </div>
    <div class="scene-cam">
      <div id="sc7stage" class="hero-pan" style="position:relative; width:1300px; height:600px;">
        <div id="sc7desktop" style="position:absolute; left:0; top:30px; opacity:0; transform:translateY(20px);"></div>
        <div id="sc7phone" style="position:absolute; right:20px; top:-40px; opacity:0; transform:translateY(30px);"></div>
      </div>
      <div id="sc7line" class="typewrite line-mid on-light" style="margin-top:6px;"></div>
    </div>
  </section>

  <!-- SC8 — logo return, tagline, CTA -->
  <section id="sc8" class="scene bg-paper">
    <div class="scene-cam">
      <div class="brand-row" id="sc8brand"><div class="brand-mark-lg">D<span class="spark-badge" id="sc8spark"></span></div><div class="wordmark">Doxha Church</div></div>
      <div class="line-sub on-light" id="sc8tagline" style="margin-top:14px; opacity:0; transition:opacity .6s ease;">Le système qui fait tourner votre église.</div>
      <div class="cta-line" id="sc8cta" style="color:#8a92a6;">Essai gratuit — doxhachurch.com</div>
    </div>
  </section>

  <div class="fake-cursor" id="liveCursor"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3l14 8-6 1.5L11 19 5 3Z" fill="#141b3a" stroke="#fff" stroke-width="1"/></svg></div>
  <div class="click-ring" id="liveRing"></div>

  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="progress"></div>
  <div id="blackout"></div>
</div>

<script>
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
  function clearEl(elm) { elm.innerHTML = ''; }
  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // typewriter: smooth character-by-character reveal with a blinking cursor
  function typewrite(container, text, msPerChar, accentWords) {
    const ranges = [];
    (accentWords || []).forEach(w => { const idx = text.indexOf(w); if (idx >= 0) ranges.push([idx, idx + w.length]); });
    ranges.sort((a, b) => a[0] - b[0]);
    container.innerHTML = '<span class="tw-text"></span><span class="tw-cursor"></span>';
    const textSpan = container.querySelector('.tw-text');
    const total = text.length;
    return new Promise(resolve => {
      let i = 0;
      function render() {
        const shown = text.slice(0, i);
        if (!ranges.length) { textSpan.textContent = shown; return; }
        let html = '', idx = 0;
        for (const [s, e] of ranges) {
          if (idx < s) html += escapeHtml(shown.slice(idx, Math.min(s, shown.length)));
          if (shown.length > s) html += `<span class="tw-accent">${escapeHtml(shown.slice(s, Math.min(e, shown.length)))}</span>`;
          idx = e;
        }
        if (idx < shown.length) html += escapeHtml(shown.slice(idx));
        textSpan.innerHTML = html;
      }
      (function tick() {
        render();
        i++;
        if (i <= total) setTimeout(tick, msPerChar);
        else setTimeout(resolve, 340);
      })();
    });
  }

  const SEQ = [
    { build: screenDashboard, text: 'Doxha.', speed: 80, hold: 1100, interact: interactDashboard },
    { build: screenMembres, text: 'Membres.', speed: 60, hold: 1900, interact: interactMembres, variant: 'right' },

  // ---- screen transition: a reliable cross-dissolve with directional variety — old and new both
  // live inside #content at once (both grid-area:1/1, so they overlap pixel-for-pixel, nothing to
  // measure or drift), crossing opacity over the same window. Each cut gets its own small, subtle
  // push direction (up/down/left/right/scale) so consecutive screens don't all arrive identically. ----
  const SCREEN_FROM = 'perspective(1700px) rotateX(4deg) rotateY(-3.2deg) scale(1)';
  const EASE_PRO = 'cubic-bezier(.4,0,.2,1)';
  const VARIANTS = {
    up:    { enter: 'translateY(34px)',  exit: 'translateY(-16px)' },
    down:  { enter: 'translateY(-34px)', exit: 'translateY(16px)' },
    left:  { enter: 'translateX(42px)',  exit: 'translateX(-18px)' },
    right: { enter: 'translateX(-42px)', exit: 'translateX(18px)' },
    scale: { enter: 'scale(1.05)',       exit: 'scale(.98)' },
  };
  async function settleIn(fresh) {
    fresh.style.transition = 'none';
    fresh.style.animation = 'screenPush 3.5s cubic-bezier(.22,.08,.32,1) forwards';
  }
  async function crossfadeTo(content, buildNextFn, variantName) {
    const variant = VARIANTS[variantName] || null;
    const oldScreen = content.querySelector('.app-screen');
    if (!oldScreen) {
      content.innerHTML = buildNextFn();
      const fresh = content.querySelector('.app-screen');
      fresh.style.animation = 'none';
      fresh.style.opacity = '0';
      fresh.style.transition = 'none';
      void fresh.offsetWidth;
      fresh.style.transition = `opacity .55s ${EASE_PRO}`;
      requestAnimationFrame(() => { fresh.style.opacity = '1'; });
      await wait(520);
      await settleIn(fresh);
      return fresh;
    }
    // freeze the old screen's current tilt so it holds its exact look while it dissolves.
    // #content is a CSS grid and every .app-screen has grid-area:1/1, so old and new simply
    // occupy the same cell and overlap pixel-for-pixel — no manual rects, no resize, nothing to drift.
    const frozen = getComputedStyle(oldScreen).transform;
    const oldBase = frozen === 'none' ? SCREEN_FROM : frozen;
    oldScreen.style.animation = 'none';
    oldScreen.style.transform = oldBase;
    oldScreen.style.zIndex = '1';

    const wrap = document.createElement('div');
    wrap.innerHTML = buildNextFn();
    const fresh = wrap.firstElementChild;
    fresh.style.animation = 'none';
    fresh.style.transform = variant ? `${variant.enter} ${SCREEN_FROM}` : SCREEN_FROM;
    fresh.style.zIndex = '2';
    fresh.style.opacity = '0';
    content.appendChild(fresh);

    void oldScreen.offsetWidth;
    oldScreen.style.transition = `opacity .6s ${EASE_PRO}, transform .6s ${EASE_PRO}`;
    fresh.style.transition = `opacity .6s ${EASE_PRO}, transform .68s ${EASE_PRO}`;
    requestAnimationFrame(() => {
      oldScreen.style.opacity = '0';
      if (variant) oldScreen.style.transform = `${oldBase} ${variant.exit}`;
      fresh.style.opacity = '1';
      fresh.style.transform = SCREEN_FROM;
    });
    await wait(580);
    oldScreen.remove();
    fresh.style.zIndex = '';
    await settleIn(fresh);
    return fresh;
  }
  async function fadeInFresh(content) {
    const fresh = content.querySelector('.app-screen');
    fresh.style.animation = 'none';
    fresh.style.opacity = '0';
    fresh.style.transition = 'none';
    void fresh.offsetWidth;
    fresh.style.transition = `opacity .55s ${EASE_PRO}`;
    requestAnimationFrame(() => { fresh.style.opacity = '1'; });
    await wait(520);
    await settleIn(fresh);
    return fresh;
  }
  async function exitFade(content) {
    const oldScreen = content.querySelector('.app-screen');
    if (!oldScreen) return;
    oldScreen.style.animation = 'none';
    const frozen = getComputedStyle(oldScreen).transform;
    oldScreen.style.transform = frozen === 'none' ? SCREEN_FROM : frozen;
    void oldScreen.offsetWidth;
    oldScreen.style.transition = `opacity .6s ${EASE_PRO}, transform .6s ${EASE_PRO}`;
    requestAnimationFrame(() => {
      oldScreen.style.opacity = '0';
      oldScreen.style.transform = oldScreen.style.transform + ' scale(.97)';
    });
    await wait(580);
  }

    host.innerHTML = buildPhoneMockup();
    host.querySelector('.device-iphone-14-pro').style.transform = 'scale(.82)';
    requestAnimationFrame(() => requestAnimationFrame(() => host.classList.add('in')));
    const lineEl = document.getElementById('sc4line');
    await wait(750);
    await typewrite(lineEl, 'Disponible sur mobile.', 40);
    await wait(2100);
    return host;
  }

  // ---------------- SC5: the AI layer ----------------
  async function sceneAI() {
    show('sc5');
    const content = document.getElementById('sc5content');
    content.innerHTML = screenIA();
    await fadeInFresh(content);
    await interactIA(content);
    await wait(2400);
    cursorHide();
  }

  // ---------------- SC6: breathing ----------------
  async function sceneBreathe() {
    show('sc6');
    const t = document.getElementById('sc6text');
    await wait(500);
    await typewrite(t, 'Moins d’administration.', 45);
    await wait(1300);
    t.style.transition = 'opacity .35s ease'; t.style.opacity = '0';
    await wait(380);
    t.style.transition = 'none'; t.innerHTML = ''; t.style.opacity = '1';
    await typewrite(t, 'Plus de temps pour l’essentiel.', 40);
    await wait(1700);
  }

  // ---------------- SC7: hero shot — desktop and mobile together, no abstract graphics ----------------
  async function sceneHero() {
    show('sc7');
    const desktopHost = document.getElementById('sc7desktop');
    const phoneHost = document.getElementById('sc7phone');
    desktopHost.innerHTML = screenDashboard();
    const desktopScreen = desktopHost.querySelector('.app-screen');
    desktopScreen.style.animation = 'none';
    desktopScreen.style.transformOrigin = 'left center';
    desktopScreen.style.transform = 'scale(.6) rotateY(-6deg)';
    phoneHost.innerHTML = buildPhoneMockup();
    phoneHost.querySelector('.device-iphone-14-pro').style.transform = 'scale(.56) rotateY(8deg)';
    desktopHost.style.transition = `opacity .8s ${EASE_PRO}, transform .8s ${EASE_PRO}`;
    phoneHost.style.transition = `opacity .8s ${EASE_PRO} .15s, transform .8s ${EASE_PRO} .15s`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      desktopHost.style.opacity = '1'; desktopHost.style.transform = 'translateY(0)';
      phoneHost.style.opacity = '1'; phoneHost.style.transform = 'translateY(0)';
    }));
    const lineEl = document.getElementById('sc7line');
    await wait(1100);
    await typewrite(lineEl, 'Un système. Une église alignée.', 34);
    await wait(2300);
  }

  // ---------------- SC8: logo return, tagline, CTA ----------------
  function sceneCTA() {
    show('sc8');
    const brand = document.getElementById('sc8brand');
    setTimeout(() => brand.classList.add('in'), 150);
    setTimeout(() => document.getElementById('sc8spark').classList.add('in'), 500);
    setTimeout(() => { document.getElementById('sc8tagline').style.opacity = '1'; }, 600);
    setTimeout(() => document.getElementById('sc8cta').classList.add('in'), 950);
  }

  const TOTAL_MS = 62000;
  (async () => {
    await sceneLogo();
    document.getElementById('blackout').classList.add('on');
    await wait(280);
    document.getElementById('blackout').classList.remove('on');

    const seed = await sceneOpen();
    await wait(150);
    seed.style.transition = `transform .76s ${EASE_PRO}, filter .7s ${EASE_PRO}, opacity .64s ${EASE_PRO} .1s`;
    seed.style.transformOrigin = '50% 50%';
    requestAnimationFrame(() => {
      seed.style.transform = (seed.style.transform || '') + ' scale(3.2)';
      seed.style.filter = 'blur(9px)';
      seed.style.opacity = '0';
    });
    const t1doxha = document.getElementById('sc1doxha'); t1doxha.style.transition = 'opacity .35s ease'; t1doxha.style.opacity = '0';
    await wait(640);

    await sceneJourney();
    await exitFade(document.getElementById('sc3content'));
    await sceneAI();
    await sceneBreathe();
    await sceneMobile();
    await sceneHero();
    await wait(300);
    sceneCTA();
    setTimeout(() => document.getElementById('blackout').classList.add('on'), 4600);
  })();

  const progressEl = document.getElementById('progress');
  const t0 = performance.now();
  function tickProgress(now) {
    const pct = Math.min(100, ((now - t0) / TOTAL_MS) * 100);
    progressEl.style.width = pct + '%';
    if (pct < 100) requestAnimationFrame(tickProgress);
  }
  requestAnimationFrame(tickProgress);
</script>
</body>
</html>
