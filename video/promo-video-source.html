<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Doxha Church — Promo</title>
<link rel="stylesheet" href="../css/devices.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; font-family: -apple-system, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif; }
  * { box-sizing: border-box; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; }

  .scene {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    opacity:0; transition: opacity .5s ease; overflow:hidden;
  }
  .scene.active { opacity:1; z-index:2; }
  .scene.bg-navy { background: linear-gradient(165deg, #171d3e 0%, #0c0f22 55%, #07091a 100%); }
  .scene.bg-white { background: linear-gradient(165deg, #ffffff 0%, #ffffff 55%, #f3eefb 100%); }
  .scene.bg-alt { background: linear-gradient(165deg, #f8f8fb 0%, #f6f7fb 55%, #f0edf9 100%); }

  .scene-cam { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .scene.active .scene-cam { animation: camBreathe 6s ease-in-out infinite alternate; }
  @keyframes camBreathe { from { transform: scale(1) translateY(0); } to { transform: scale(1.015) translateY(-5px); } }

  .spot { position:absolute; inset:-10%; z-index:0; pointer-events:none; overflow:hidden; }
  .spot svg { position:absolute; width:100%; height:100%; }
  .scene.active .spot { animation: spotDrift 9s ease-in-out infinite alternate; }
  @keyframes spotDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(1.2%, -1%) scale(1.015); } }

  .sparkle { display:inline-block; width:.62em; height:.62em; vertical-align:.02em; }
  .sparkle svg { width:100%; height:100%; }

  .buildup { font-weight: 800; text-align:center; }
  .bw { display:inline-block; opacity:0; transform: translateY(.3em); filter: blur(6px); }
  .bw.in { animation: bwIn .5s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes bwIn { to { opacity:1; transform:translateY(0); filter:blur(0); } }
  .bw.accent { background:linear-gradient(135deg,#3457e8,#2fe3c4); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .line-big { font-size:72px; letter-spacing:-.03em; line-height:1.3; max-width:1650px; }
  .line-big.on-dark { color:#fff; }
  .line-big.on-light { color:#14171f; }
  .line-sub { font-size:32px; font-weight:700; margin-top:6px; }
  .line-sub.on-dark { color:rgba(255,255,255,.62); }
  .line-sub.on-light { color:#5b6274; }
  .line-mid { font-size:44px; font-weight:800; letter-spacing:-.02em; text-align:center; }
  .line-mid.on-dark { color:#fff; }
  .line-mid.on-light { color:#14171f; }

  .brand-row { display:flex; align-items:center; gap:22px; opacity:0; transform:scale(.85); }
  .brand-row.in { animation: brandIn .6s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes brandIn { to { opacity:1; transform:scale(1); } }
  .brand-mark-lg { width:104px; height:104px; border-radius:28px; background:linear-gradient(135deg,#5c7cf2,#0a0d1c 120%); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:52px; box-shadow:0 30px 70px rgba(33,64,201,.45); position:relative; }
  .brand-mark-lg::after { content:''; position:absolute; inset:-18px; border-radius:38px; background:radial-gradient(circle, rgba(47,227,196,.5), transparent 70%); z-index:-1; opacity:0; }
  .brand-mark-lg.burst::after { animation: markBurst 1s ease forwards; }
  @keyframes markBurst { 0%{opacity:.9; transform:scale(.4);} 100%{opacity:0; transform:scale(2.4);} }
  .brand-mark-lg.pulse { animation: markPulse 2.2s ease-in-out infinite; }
  @keyframes markPulse { 0%,100% { box-shadow:0 30px 70px rgba(33,64,201,.45); } 50% { box-shadow:0 30px 90px rgba(47,227,196,.55); } }
  .spark-badge { position:absolute; top:-14px; right:-14px; width:34px; height:34px; color:#2fe3c4; filter:drop-shadow(0 4px 10px rgba(47,227,196,.5));
    opacity:0; transform:scale(.3) rotate(-30deg); }
  .spark-badge.in { animation: sparkIn .5s cubic-bezier(.2,1.6,.3,1) .4s forwards, sparkSpin 5s linear .9s infinite; }
  @keyframes sparkIn { to { opacity:1; transform:scale(1) rotate(0deg); } }
  @keyframes sparkSpin { to { transform:scale(1) rotate(360deg); } }
  .wordmark { font-size:66px; font-weight:800; letter-spacing:-.02em; color:#fff; }
  .wordmark.on-light { color:#14171f; }
  .cta-line { margin-top:26px; font-size:24px; color:rgba(255,255,255,.5); letter-spacing:.02em; opacity:0; }
  .cta-line.in { animation: fadeUp .6s ease forwards; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ---- screen-rise: mockup slides up with a settled tilt ---- */
  .rise-wrap { perspective:1500px; }
  .rise { transform: translateY(220px) rotateX(22deg) scale(.92); opacity:0; transform-origin:center bottom; }
  .rise.in { animation: riseIn .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes riseIn { to { transform: translateY(0) rotateX(7deg) scale(1); opacity:1; } }

  /* small tilted card trio (payoff proof) */
  .card-trio { display:flex; align-items:flex-end; perspective:1400px; }
  .card-trio .rise:nth-child(1) { transform: translateY(220px) rotateX(20deg) rotateZ(-7deg) scale(.9); margin-right:-40px; z-index:1; }
  .card-trio .rise:nth-child(1).in { animation: riseIn1 .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes riseIn1 { to { transform: translateY(10px) rotateX(6deg) rotateZ(-7deg) scale(.92); opacity:1; } }
  .card-trio .rise:nth-child(2) { z-index:2; }
  .card-trio .rise:nth-child(3) { transform: translateY(220px) rotateX(20deg) rotateZ(7deg) scale(.9); margin-left:-40px; z-index:1; }
  .card-trio .rise:nth-child(3).in { animation: riseIn3 .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes riseIn3 { to { transform: translateY(10px) rotateX(6deg) rotateZ(7deg) scale(.92); opacity:1; } }

  /* ---- shared "real product" UI kit ---- */
  .app-screen { width:1040px; background:#fff; border-radius:20px; overflow:hidden; border:1px solid rgba(20,23,40,.06);
    box-shadow: 0 70px 130px rgba(20,23,40,.20), 0 2px 0 rgba(20,23,40,.03); }
  .app-top { padding:26px 34px 20px; border-bottom:1px solid #eef0f5; display:flex; align-items:center; justify-content:space-between; }
  .app-title { font-size:26px; font-weight:800; color:#14171f; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .app-title .sparkle { color:#6d4fe0; width:24px; height:24px; }
  .app-cta { background:linear-gradient(135deg,#3457e8,#2fe3c4); color:#fff; font-size:14px; font-weight:700; padding:11px 20px; border-radius:10px; white-space:nowrap; }
  .app-tabs { display:flex; gap:24px; font-size:14px; font-weight:600; color:#9aa1b3; }
  .app-tabs span.active { color:#14171f; }
  .app-body { padding:26px 34px 32px; }

  .avatar { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#fff; flex:none; }
  .avatar.sm { width:24px; height:24px; border-radius:8px; font-size:11px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:4px 9px; border-radius:6px; }
  .pill-status { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .pill-status .dot { width:6px; height:6px; border-radius:50%; }

  .stat-row { display:flex; gap:16px; margin-bottom:22px; }
  .stat-card { flex:1; background:#f8f9fc; border:1px solid #eef0f5; border-radius:14px; padding:16px 18px; }
  .stat-num { font-size:26px; font-weight:800; color:#14171f; }
  .stat-lbl { font-size:13px; color:#8a92a6; font-weight:600; margin-top:3px; }
  .stat-delta { font-size:12px; font-weight:700; color:#0d9488; margin-top:4px; }

  .row-list .row { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid #f1f2f7; }
  .row-list .row:last-child { border-bottom:none; }
  .row-name { font-size:15px; font-weight:700; color:#14171f; flex:1; }
  .row-sub { font-size:13px; color:#9aa1b3; width:150px; }

  .event-card { display:flex; gap:16px; align-items:center; padding:14px; background:#f8f9fc; border:1px solid #eef0f5; border-radius:14px; margin-bottom:12px; }
  .event-date { width:58px; height:58px; border-radius:12px; background:#fff; border:1px solid #eef0f5; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .event-date .d { font-size:20px; font-weight:800; color:#14171f; line-height:1; }
  .event-date .m { font-size:10px; font-weight:700; color:#8a92a6; text-transform:uppercase; }
  .event-title { font-size:16px; font-weight:700; color:#14171f; }
  .event-meta { font-size:13px; color:#9aa1b3; margin-top:3px; }

  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; background:#eef1fb; color:#2140c9; }
  .channel-row { display:flex; gap:14px; margin-bottom:20px; }
  .channel-pill { display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; background:#f8f9fc; border:1px solid #eef0f5; font-size:13px; font-weight:700; color:#3a4152; }
  .channel-pill svg { width:16px; height:16px; }
  .channel-pill.on { background:#e9f9f5; border-color:#c7f0e6; color:#0d9488; }
  .compose-box { background:#f8f9fc; border:1px solid #eef0f5; border-radius:14px; padding:18px; font-size:14px; color:#5b6274; line-height:1.6; margin-bottom:18px; }

  .insight-card { display:flex; gap:14px; padding:16px; background:#f8f9fc; border:1px solid #eef0f5; border-radius:14px; margin-bottom:12px; }
  .insight-icon { width:38px; height:38px; border-radius:11px; background:#f0ecfe; color:#6d4fe0; display:flex; align-items:center; justify-content:center; flex:none; }
  .insight-icon .sparkle { width:18px; height:18px; }
  .insight-text { font-size:14px; font-weight:600; color:#14171f; line-height:1.5; }
  .insight-link { font-size:12px; font-weight:700; color:#3457e8; margin-top:4px; }

  .screen-fx { opacity:0; transform:translateY(18px) scale(.985); }
  .screen-fx.in { animation: screenIn .55s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes screenIn { to { opacity:1; transform:translateY(0) scale(1); } }

  /* ---- chaos scene: scattered fake app windows ---- */
  .chaos-window { position:absolute; width:340px; background:#fff; border-radius:14px; box-shadow:0 40px 70px rgba(10,15,35,.35); overflow:hidden; opacity:0; }
  .chaos-window.in { animation: chaosIn .55s cubic-bezier(.2,1.3,.3,1) forwards; }
  @keyframes chaosIn { 0%{opacity:0; transform:scale(.7) rotate(var(--r,0deg));} 100%{opacity:1; transform:scale(1) rotate(var(--r,0deg));} }
  .chaos-bar { height:30px; display:flex; align-items:center; gap:5px; padding:0 12px; background:#f3f4f8; }
  .chaos-dot { width:7px; height:7px; border-radius:50%; background:#d8dbe4; }
  .chaos-body { padding:14px; }

  /* ---- accumulation badges (scene 1) ---- */
  .accum-badge { display:inline-flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:14px 22px; opacity:0; transform:scale(.7); }
  .accum-badge.in { animation: fiIn .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes fiIn { to { opacity:1; transform:scale(1); } }
  .accum-badge svg { width:24px; height:24px; color:#2fe3c4; }
  .accum-badge span { font-size:24px; font-weight:700; color:#fff; }

  #vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.26) 100%); }
  #progress { position:absolute; left:0; bottom:0; height:5px; width:0%; z-index:6; background: linear-gradient(90deg,#3457e8,#2fe3c4); }
  #blackout { position:absolute; inset:0; background:#000; opacity:0; z-index:10; pointer-events:none; transition: opacity .7s ease; }
  #blackout.on { opacity:1; }
</style>
</head>
<body>
<div id="stage">

  <!-- SCENE 1 (0:00-0:08) — accumulation -->
  <section id="sc1" class="scene bg-navy active">
    <div class="spot"></div>
    <div class="scene-cam">
      <div id="accumWrap" style="display:flex; flex-wrap:wrap; gap:18px; justify-content:center; max-width:1200px;"></div>
      <div id="sc1line" class="buildup line-mid on-dark" style="margin-top:44px;"></div>
    </div>
  </section>

  <!-- SCENE 2 (0:08-0:15) — chaos -->
  <section id="sc2" class="scene bg-navy">
    <div class="spot"></div>
    <div class="scene-cam">
      <div id="chaosWrap" style="position:relative; width:1300px; height:560px;"></div>
      <div id="sc2line" class="buildup line-mid on-dark" style="margin-top:14px; max-width:1300px;"></div>
    </div>
  </section>

  <!-- SCENE 3 (0:15-0:20) — logo reveal -->
  <section id="sc3" class="scene bg-navy">
    <div class="spot"></div>
    <div class="scene-cam">
      <div class="brand-row" id="sc3brand"><div class="brand-mark-lg pulse" id="sc3mark">D<span class="spark-badge" id="sc3spark"></span></div><div class="wordmark">Doxha Church</div></div>
      <div id="sc3line" class="buildup line-sub on-dark" style="margin-top:22px;"></div>
    </div>
  </section>

  <!-- SCENE 4 (0:20-0:45) — rapid screenshots -->
  <section id="sc4" class="scene bg-alt">
    <div class="spot"></div>
    <div class="scene-cam">
      <div id="sc4line" class="buildup line-mid on-light" style="margin-bottom:30px; min-height:56px;"></div>
      <div class="rise-wrap">
        <div class="rise" id="sc4rise"><div id="sc4host"></div></div>
      </div>
    </div>
  </section>

  <!-- SCENE 5 (0:45-0:50) — CTA end card -->
  <section id="sc5" class="scene bg-navy">
    <div class="spot"></div>
    <div class="scene-cam">
      <div class="brand-row" id="sc5brand"><div class="brand-mark-lg pulse" style="width:88px; height:88px; border-radius:24px; font-size:44px;">D<span class="spark-badge" id="sc5spark" style="width:28px; height:28px; top:-10px; right:-10px;"></span></div><div class="wordmark">Doxha Church</div></div>
      <div class="cta-line" id="sc5cta">Essai gratuit — 14 jours · doxhachurch.com</div>
    </div>
  </section>

  <div id="vignette"></div>
  <div id="progress"></div>
  <div id="blackout"></div>
</div>

<script>
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

  document.querySelectorAll('.scene .spot').forEach(spot => {
    const dark = spot.closest('.scene').classList.contains('bg-navy');
    const c1 = dark ? 'rgba(255,255,255,.07)' : 'rgba(52,87,232,.16)';
    const c2 = dark ? 'rgba(255,255,255,.05)' : 'rgba(47,227,196,.14)';
    spot.innerHTML = `<svg viewBox="0 0 1920 1080" fill="none">
      <circle cx="440" cy="540" r="640" stroke="${c1}" stroke-width="1.5"/>
      <circle cx="1480" cy="540" r="640" stroke="${c2}" stroke-width="1.5"/>
    </svg>`;
  });

  const SPARKLE = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6Z" fill="currentColor"/></svg>';
  document.querySelectorAll('.spark-badge').forEach(s => s.innerHTML = SPARKLE);

  function buildup(container, text, stepMs, accentWords) {
    accentWords = accentWords || [];
    const words = text.split(' ');
    return new Promise(resolve => {
      words.forEach((w, i) => {
        setTimeout(() => {
          const span = el('span', 'bw' + (accentWords.includes(w.replace(/[.,?!]/g,'')) ? ' accent' : ''), w + (i < words.length - 1 ? '&nbsp;' : ''));
          container.appendChild(span);
          requestAnimationFrame(() => requestAnimationFrame(() => span.classList.add('in')));
          if (i === words.length - 1) setTimeout(resolve, 500);
        }, i * stepMs);
      });
    });
  }
  function clearEl(elm) { elm.innerHTML = ''; }

  let currentId = 'sc1';
  function show(id) {
    const prev = document.getElementById(currentId);
    if (prev && prev.id !== id) prev.classList.remove('active');
    document.getElementById(id).classList.add('active');
    currentId = id;
  }

  // ---------------- SCENE 1: accumulation ----------------
  const ACCUM_ITEMS = [
    ['Membres', '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.6 2.7-5.8 6-5.8s6 2.2 6 5.8M16 4.4a3.2 3.2 0 0 1 0 6.4M20 20c0-2.8-1.7-4.7-4-5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'],
    ['Événements', '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'],
    ['Dons', '<svg viewBox="0 0 24 24" fill="none"><path d="M3 10h18M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>'],
    ['Bénévoles', '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.4-9.5-9C.8 8.6 2.6 5 6 5c2 0 3.3 1.1 4 2 1.5-1.5 3.5-2.6 5.5-2 2.6.8 3.4 4.3 1.9 7-2.4 4.5-9.4 9-9.4 9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>'],
    ['Messages', '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>'],
    ['Documents', '<svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'],
  ];
  async function scene1() {
    show('sc1');
    const wrap = document.getElementById('accumWrap');
    wrap.innerHTML = '';
    for (const [label, icon] of ACCUM_ITEMS) {
      const b = el('div', 'accum-badge', `${icon}<span>${label}</span>`);
      wrap.appendChild(b);
      requestAnimationFrame(() => b.classList.add('in'));
      await new Promise(r => setTimeout(r, 560));
    }
    await buildup(document.getElementById('sc1line'), "Tout s'accumule.", 220);
    await new Promise(r => setTimeout(r, 2400));
  }

  // ---------------- SCENE 2: chaos ----------------
  function scene2Windows() {
    const wrap = document.getElementById('chaosWrap');
    wrap.innerHTML = '';
    const wins = [
      { x: 0, y: 20, r: -8, bar: '#e9edf2', body: `<div style="font-size:11px; font-weight:700; color:#8a92a6; margin-bottom:8px;">membres.xlsx</div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#eef0f5;">
        ${Array.from({length:9}).map((_,i)=>`<div style="background:#fff; height:22px; font-size:10px; color:#c3c7d1; display:flex; align-items:center; padding:0 6px;">${i<3?'':''}</div>`).join('')}
        </div>` },
      { x: 460, y: 0, r: 6, bar: '#f3f4f8', body: `<div style="font-size:11px; font-weight:700; color:#8a92a6; margin-bottom:10px;">Boîte de réception</div>
        <div style="font-size:12px; color:#3a4152; font-weight:700; margin-bottom:3px;">Re: planning culte dimanche</div>
        <div style="font-size:11px; color:#aab0bd; margin-bottom:10px;">— il y a 2h</div>
        <div style="font-size:12px; color:#3a4152; font-weight:700; margin-bottom:3px;">Liste des bénévoles ?</div>
        <div style="font-size:11px; color:#aab0bd;">— il y a 5h</div>` },
      { x: 120, y: 300, r: 5, bar: '#dcf8c6', body: `<div style="font-size:11px; font-weight:700; color:#4a7d3d; margin-bottom:10px;">Groupe Diacres</div>
        <div style="background:#fff; border-radius:8px; padding:8px 10px; font-size:11px; color:#3a4152; margin-bottom:6px; max-width:80%;">Qui gère les dons ce mois ?</div>
        <div style="background:#dcf8c6; border-radius:8px; padding:8px 10px; font-size:11px; color:#3a4152; margin-left:20%;">Je regarde le fichier Excel</div>` },
      { x: 620, y: 280, r: -6, bar: '#e9edf2', body: `<div style="font-size:11px; font-weight:700; color:#8a92a6; margin-bottom:8px;">Mars</div>
        <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px;">
        ${Array.from({length:21}).map((_,i)=>`<div style="height:16px; border-radius:3px; background:${[4,11,18].includes(i)?'#3457e8':'#f1f2f7'};"></div>`).join('')}
        </div>` },
    ];
    wins.forEach((w, i) => {
      const win = el('div', 'chaos-window', `<div class="chaos-bar"><span class="chaos-dot"></span><span class="chaos-dot"></span><span class="chaos-dot"></span></div><div class="chaos-body">${w.body}</div>`);
      win.style.left = w.x + 'px'; win.style.top = w.y + 'px'; win.style.setProperty('--r', w.r + 'deg'); win.style.background = '#fff';
      win.querySelector('.chaos-bar').style.background = w.bar;
      wrap.appendChild(win);
      setTimeout(() => win.classList.add('in'), i * 260);
    });
  }
  async function scene2() {
    show('sc2');
    scene2Windows();
    await new Promise(r => setTimeout(r, 2200));
    await buildup(document.getElementById('sc2line'), "Quand tout est dispersé, rien n'avance vraiment.", 130);

  // ---------------- SCENE 3: logo reveal ----------------
  async function scene3() {

  // ---------------- SCENE 4: rapid product screens ----------------
  function screenDashboard() {

  function screenCommunication() {
    return `<div class="app-screen"><div class="app-top"><div class="app-title">Communication</div><div class="app-cta">Publier</div></div>
    <div class="app-body">

  function screenDons() {

        <div class="event-card" style="display:block;"><div class="row-name" style="margin-bottom:8px;"><span class="avatar sm" style="background:#3457e8; margin-right:8px;">MD</span>Marie Dubois</div><span class="tag" style="background:#fdedf1; color:#d1476b;">Invitée par Sarah</span></div></div>

        <div class="event-card" style="display:block;"><div class="row-name" style="margin-bottom:8px;"><span class="avatar sm" style="background:#d1476b; margin-right:8px;">CR</span>Camille Rousseau</div><span class="tag" style="background:#e6faf5; color:#0d9488;">Bénévole accueil</span></div></div>

    return `<div class="app-screen"><div class="app-top"><div class="app-title"><span class="sparkle">${SPARKLE}</span>Assistant IA</div></div>

      <div class="insight-card"><div class="insight-icon"><span class="sparkle">${SPARKLE}</span></div><div><div class="insight-text">3 membres n'ont pas donné de nouvelles depuis 3 semaines.</div><div class="insight-link">Voir la liste →</div></div></div>
      <div class="insight-card"><div class="insight-icon"><span class="sparkle">${SPARKLE}</span></div><div><div class="insight-text">Les dons ont augmenté de 12% ce mois-ci par rapport au précédent.</div></div></div>
      <div class="insight-card"><div class="insight-icon"><span class="sparkle">${SPARKLE}</span></div><div><div class="insight-text">Forte demande détectée : envisagez une « Soirée jeunes » ce mois-ci.</div><div class="insight-link">Planifier →</div></div></div>

  const SC4_SEQUENCE = [
    { build: screenDashboard, text: 'Une plateforme conçue pour centraliser toute la vie de votre église.', speed: 90, hold: 1800 },
    { build: screenMembres, text: 'Les membres.', speed: 220, hold: 2600 },
    { build: screenEvenements, text: 'Les événements.', speed: 220, hold: 2600 },
    { build: screenCommunication, text: 'La communication.', speed: 220, hold: 2600 },
    { build: screenDons, text: 'Les dons.', speed: 220, hold: 2600 },
    { build: screenOrganisation, text: "L'organisation.", speed: 220, hold: 3000 },
    { build: screenIA, text: "Et l'intelligence artificielle.", speed: 150, hold: 2800 },
  ];
  async function scene4() {
    show('sc4');
    const host = document.getElementById('sc4host');
    const rise = document.getElementById('sc4rise');
    const lineEl = document.getElementById('sc4line');
    for (let i = 0; i < SC4_SEQUENCE.length; i++) {
      const step = SC4_SEQUENCE[i];
      host.innerHTML = step.build();
      rise.classList.remove('in'); void rise.offsetWidth;
      if (i === 0) rise.classList.add('in'); else { rise.style.transition = 'none'; rise.style.transform = 'translateY(0) rotateX(7deg) scale(1)'; rise.style.opacity = '1'; void rise.offsetWidth; rise.style.transition = ''; }
      const inner = host.querySelector('.app-screen');
      inner.classList.add('screen-fx');
      requestAnimationFrame(() => inner.classList.add('in'));
      clearEl(lineEl);
      await buildup(lineEl, step.text, step.speed);
      await new Promise(r => setTimeout(r, step.hold));
    }
  }

  function scene5() {
    show('sc5');
    setTimeout(() => document.getElementById('sc5brand').classList.add('in'), 150);
    setTimeout(() => document.getElementById('sc5spark').classList.add('in'), 500);
    setTimeout(() => document.getElementById('sc5cta').classList.add('in'), 700);
  }

  const TOTAL_MS = 50000;
  (async () => {
    await scene1();
    await new Promise(r => setTimeout(r, 900));
    await scene2();
    await new Promise(r => setTimeout(r, 1000));
    document.getElementById('blackout').classList.add('on');
    await new Promise(r => setTimeout(r, 700));
    document.getElementById('blackout').classList.remove('on');
    await scene3();
    await new Promise(r => setTimeout(r, 700));
    await scene4();
    await new Promise(r => setTimeout(r, 300));
    scene5();
    setTimeout(() => document.getElementById('blackout').classList.add('on'), 4500);
  })();

  const progressEl = document.getElementById('progress');
  const t0 = performance.now();
  function tickProgress(now) {
    const pct = Math.min(100, ((now - t0) / TOTAL_MS) * 100);
    progressEl.style.width = pct + '%';
    if (pct < 100) requestAnimationFrame(tickProgress);
  }
  requestAnimationFrame(tickProgress);
</script>
</body>
