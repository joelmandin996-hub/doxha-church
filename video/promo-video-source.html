<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Doxha Church — Promo</title>
<link rel="stylesheet" href="../css/devices.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; font-family: -apple-system, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif; }
  * { box-sizing: border-box; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; }

  .scene {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    opacity:0; transition: opacity .5s ease; overflow:hidden;
  }
  .scene.active { opacity:1; z-index:2; }
  .scene.bg-navy { background: linear-gradient(165deg, #1a2350 0%, #0c1130 55%, #060814 100%); }
  .scene.bg-white, .scene.bg-alt, .scene.bg-blue-hero { background: #dbe8fb; }

  .scene-cam { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .scene.active .scene-cam { animation: camBreathe 6s ease-in-out infinite alternate; }
  @keyframes camBreathe { from { transform: scale(1) translateY(0); } to { transform: scale(1.015) translateY(-5px); } }

  .spot { position:absolute; inset:-10%; z-index:0; pointer-events:none; overflow:hidden; }
  .spot svg { position:absolute; width:100%; height:100%; }
  .scene.active .spot { animation: spotDrift 9s ease-in-out infinite alternate; }
  @keyframes spotDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(1.2%, -1%) scale(1.015); } }

  .sparkle { display:inline-block; width:.62em; height:.62em; vertical-align:.02em; }
  .sparkle svg { width:100%; height:100%; }

  .buildup { font-weight: 800; text-align:center; }
  .bw { display:inline-block; opacity:0; transform: translateY(.3em); filter: blur(6px); }
  .bw.in { animation: bwIn .5s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes bwIn { to { opacity:1; transform:translateY(0); filter:blur(0); } }
  .bw.accent { background:linear-gradient(135deg,#3457e8,#2fe3c4); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ---- typewriter: smooth, continuous, natural — the reference's primary text technique ---- */
  .typewrite { font-weight: 600; text-align:center; }
  .tw-cursor { display:inline-block; width:3px; margin-left:2px; vertical-align:-.06em; animation: twBlink .9s steps(1) infinite; }
  @keyframes twBlink { 50% { opacity:0; } }
  .tw-accent { background:linear-gradient(135deg,#3457e8,#2fe3c4); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }

  .line-big { font-size:68px; font-weight:600; letter-spacing:-.02em; line-height:1.35; max-width:1650px; }
  .line-big.on-dark { color:#fff; }
  .line-big.on-light { color:#14171f; }
  .line-sub { font-size:30px; font-weight:500; margin-top:6px; }
  .line-sub.on-dark { color:rgba(255,255,255,.62); }
  .line-sub.on-light { color:#5b6274; }
  .line-mid { font-size:42px; font-weight:600; letter-spacing:-.015em; text-align:center; }
  .line-mid.on-dark { color:#fff; }
  .line-mid.on-light { color:#14171f; }

  .brand-row { display:flex; align-items:center; gap:22px; opacity:0; transform:scale(.85); }
  .brand-row.in { animation: brandIn .6s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes brandIn { to { opacity:1; transform:scale(1); } }
  .brand-mark-lg { width:104px; height:104px; border-radius:28px; background:linear-gradient(135deg,#5c7cf2,#0a0d1c 120%); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:52px; box-shadow:0 30px 70px rgba(33,64,201,.45); position:relative; }
  .brand-mark-lg::after { content:''; position:absolute; inset:-18px; border-radius:38px; background:radial-gradient(circle, rgba(47,227,196,.5), transparent 70%); z-index:-1; opacity:0; }
  .brand-mark-lg.burst::after { animation: markBurst 1s ease forwards; }
  @keyframes markBurst { 0%{opacity:.9; transform:scale(.4);} 100%{opacity:0; transform:scale(2.4);} }
  .brand-mark-lg.pulse { animation: markPulse 2.2s ease-in-out infinite; }
  @keyframes markPulse { 0%,100% { box-shadow:0 30px 70px rgba(33,64,201,.45); } 50% { box-shadow:0 30px 90px rgba(47,227,196,.55); } }
  .spark-badge { position:absolute; top:-14px; right:-14px; width:34px; height:34px; color:#2fe3c4; filter:drop-shadow(0 4px 10px rgba(47,227,196,.5));
    opacity:0; transform:scale(.3) rotate(-30deg); }
  .spark-badge.in { animation: sparkIn .5s cubic-bezier(.2,1.6,.3,1) .4s forwards, sparkSpin 5s linear .9s infinite; }
  @keyframes sparkIn { to { opacity:1; transform:scale(1) rotate(0deg); } }
  @keyframes sparkSpin { to { transform:scale(1) rotate(360deg); } }
  .wordmark { font-size:66px; font-weight:800; letter-spacing:-.02em; color:#fff; }
  .wordmark.on-light { color:#14171f; }
  .cta-line { margin-top:26px; font-size:24px; color:rgba(255,255,255,.5); letter-spacing:.02em; opacity:0; }
  .cta-line.in { animation: fadeUp .6s ease forwards; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ---- screen-rise: mockup slides up with a settled tilt ---- */
  .rise-wrap { perspective:1500px; }
  .rise { transform: translateY(220px) rotateX(22deg) scale(.92); opacity:0; transform-origin:center bottom; }
  .rise.in { animation: riseIn .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes riseIn { to { transform: translateY(0) rotateX(7deg) scale(1); opacity:1; } }

  /* small tilted card trio (payoff proof) */
  .card-trio { display:flex; align-items:flex-end; perspective:1400px; }
  .card-trio .rise:nth-child(1) { transform: translateY(220px) rotateX(20deg) rotateZ(-7deg) scale(.9); margin-right:-40px; z-index:1; }
  .card-trio .rise:nth-child(1).in { animation: riseIn1 .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes riseIn1 { to { transform: translateY(10px) rotateX(6deg) rotateZ(-7deg) scale(.92); opacity:1; } }
  .card-trio .rise:nth-child(2) { z-index:2; }
  .card-trio .rise:nth-child(3) { transform: translateY(220px) rotateX(20deg) rotateZ(7deg) scale(.9); margin-left:-40px; z-index:1; }
  .card-trio .rise:nth-child(3).in { animation: riseIn3 .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes riseIn3 { to { transform: translateY(10px) rotateX(6deg) rotateZ(7deg) scale(.92); opacity:1; } }

  /* ---- shared "real product" UI kit ---- */
  .app-screen { position:relative; width:1040px; background:rgba(255,255,255,.66); backdrop-filter:blur(28px) saturate(1.7); -webkit-backdrop-filter:blur(28px) saturate(1.7); border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,.55);
    box-shadow: 0 70px 130px rgba(20,32,80,.28), 0 30px 70px rgba(52,87,232,.16), inset 0 1px 0 rgba(255,255,255,.6);
    animation: screenPush 4s cubic-bezier(.22,.08,.32,1) forwards; transform-origin:52% 46%; }
  @keyframes screenPush {
    from { transform: perspective(1700px) rotateX(4deg) rotateY(-3.2deg) scale(1); }
    to   { transform: perspective(1700px) rotateX(2deg) rotateY(-1.2deg) scale(1.07); }
  }

  /* fake cursor: a small moving pointer, for the sense of a live demo */
  .fake-cursor { position:absolute; width:16px; height:16px; z-index:5; opacity:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); transition: left 1.1s cubic-bezier(.4,0,.2,1), top 1.1s cubic-bezier(.4,0,.2,1), opacity .3s ease; }
  .fake-cursor.show { opacity:1; }
  .fake-cursor svg { width:100%; height:100%; }
  .click-ring { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; border:2px solid #3457e8; opacity:0; pointer-events:none; z-index:4; }
  .click-ring.ping { animation: clickPing .5s ease-out forwards; }
  @keyframes clickPing { 0%{opacity:.7; transform:scale(.3);} 100%{opacity:0; transform:scale(1.6);} }
  .app-top { padding:26px 34px 20px; border-bottom:1px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:space-between; }
  .app-title { font-size:26px; font-weight:800; color:#14171f; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .app-title .sparkle { color:#2140c9; width:24px; height:24px; }
  .app-cta { background:linear-gradient(135deg,#3457e8,#2fe3c4); color:#fff; font-size:14px; font-weight:700; padding:11px 20px; border-radius:10px; white-space:nowrap; }
  .app-tabs { display:flex; gap:24px; font-size:14px; font-weight:600; color:#9aa1b3; }
  .app-tabs span.active { color:#14171f; }
  .app-body { padding:26px 34px 32px; }

  .search-bar { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 14px; margin-bottom:18px; width:280px; }
  .search-bar svg { width:16px; height:16px; color:#9aa1b3; flex:none; }
  .search-bar .sb-text { font-size:14px; color:#14171f; font-weight:600; min-height:1.2em; }
  .search-bar .sb-cursor { display:inline-block; width:2px; height:1em; background:#3457e8; margin-left:1px; vertical-align:-2px; animation: twBlink .9s steps(1) infinite; }
  .row.dim { opacity:.4; }
  .row.hit { background:#f0f4ff; margin:0 -14px; padding:13px 14px; border-radius:8px; }

  .avatar { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#fff; flex:none; }
  .avatar.sm { width:24px; height:24px; border-radius:8px; font-size:11px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:4px 9px; border-radius:6px; }
  .pill-status { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .pill-status .dot { width:6px; height:6px; border-radius:50%; }

  .stat-row { display:flex; gap:16px; margin-bottom:22px; }
  .stat-card { flex:1; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; padding:16px 18px; }
  .stat-num { font-size:26px; font-weight:800; color:#14171f; }
  .stat-lbl { font-size:13px; color:#8a92a6; font-weight:600; margin-top:3px; }
  .stat-delta { font-size:12px; font-weight:700; color:#0d9488; margin-top:4px; }

  .row-list .row { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid rgba(255,255,255,.45); }
  .row-list .row:last-child { border-bottom:none; }
  .row-name { font-size:15px; font-weight:700; color:#14171f; flex:1; }
  .row-sub { font-size:13px; color:#9aa1b3; width:150px; }

  .event-card { display:flex; gap:16px; align-items:center; padding:14px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; margin-bottom:12px; }
  .event-date { width:58px; height:58px; border-radius:12px; background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.6); display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .event-date .d { font-size:20px; font-weight:800; color:#14171f; line-height:1; }
  .event-date .m { font-size:10px; font-weight:700; color:#8a92a6; text-transform:uppercase; }
  .event-title { font-size:16px; font-weight:700; color:#14171f; }
  .event-meta { font-size:13px; color:#9aa1b3; margin-top:3px; }

  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; background:#eef1fb; color:#2140c9; }
  .channel-row { display:flex; gap:14px; margin-bottom:20px; }
  .channel-pill { display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); font-size:13px; font-weight:700; color:#3a4152; }
  .channel-pill svg { width:16px; height:16px; }
  .channel-pill.on { background:#e9f9f5; border-color:#c7f0e6; color:#0d9488; }
  .compose-box { background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; padding:18px; font-size:14px; color:#5b6274; line-height:1.6; margin-bottom:18px; }

  .insight-card { display:flex; gap:14px; padding:16px; background:rgba(255,255,255,.45); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); border-radius:14px; margin-bottom:12px; }
  .insight-icon { width:38px; height:38px; border-radius:11px; background:#eef1fd; color:#2140c9; display:flex; align-items:center; justify-content:center; flex:none; }
  .insight-icon .sparkle { width:18px; height:18px; }
  .insight-text { font-size:14px; font-weight:600; color:#14171f; line-height:1.5; }
  .insight-link { font-size:12px; font-weight:700; color:#3457e8; margin-top:4px; }

  .screen-fx { opacity:0; transform:translateY(18px) scale(.985); }
  .screen-fx.in { animation: screenIn .55s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes screenIn { to { opacity:1; transform:translateY(0) scale(1); } }

  /* ---- chaos scene: scattered fake app windows ---- */
  .chaos-window { position:absolute; width:340px; background:rgba(255,255,255,.5); backdrop-filter:blur(18px) saturate(1.7); -webkit-backdrop-filter:blur(18px) saturate(1.7); border:1px solid rgba(255,255,255,.6); border-radius:14px; box-shadow:0 40px 70px rgba(10,15,35,.22); overflow:hidden; opacity:0; }
  .chaos-window.in { animation: chaosIn .55s cubic-bezier(.2,1.3,.3,1) forwards; }
  .chaos-window.corner { filter:blur(2.5px); box-shadow:0 30px 50px rgba(10,15,35,.10); }
  .chaos-window.corner.in { animation: cornerIn 1.2s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes cornerIn { to { opacity:.55; transform:scale(1) rotate(var(--r,0deg)); } }

  /* ---- hook headline: word-by-word blur-slide reveal (the reference's "Stop Managing tickets" beat) ---- */
  .blurword { display:inline-block; opacity:0; filter:blur(14px); transform:translateX(18px); }
  .blurword.in { animation: blurWordIn .6s cubic-bezier(.2,1,.3,1) forwards; }
  @keyframes blurWordIn { to { opacity:1; filter:blur(0); transform:translateX(0); } }

  .product-tag { position:absolute; top:60px; right:70px; font-size:15px; font-weight:700; color:rgba(255,255,255,.85);
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); padding:9px 16px; border-radius:999px; opacity:0; }
  .product-tag.in { animation: fadeUp .5s ease forwards; }
  @keyframes chaosIn { 0%{opacity:0; transform:scale(.7) rotate(var(--r,0deg));} 100%{opacity:1; transform:scale(1) rotate(var(--r,0deg));} }
  .chaos-bar { height:30px; display:flex; align-items:center; gap:5px; padding:0 12px; background:rgba(255,255,255,.35); border-bottom:1px solid rgba(255,255,255,.5); }
  .chaos-dot { width:7px; height:7px; border-radius:50%; background:#d8dbe4; }
  .chaos-body { padding:14px; }

  /* ---- accumulation badges (scene 1) ---- */
  .accum-badge { display:inline-flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:14px 22px; opacity:0; transform:scale(.7); }
  .accum-badge.in { animation: fiIn .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes fiIn { to { opacity:1; transform:scale(1); } }
  .accum-badge svg { width:24px; height:24px; color:#2fe3c4; }
  .accum-badge span { font-size:24px; font-weight:700; color:#fff; }

  /* soft color blobs behind glass panels, so translucency/blur actually reads as glass */
  .glass-blobs { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .glass-blobs span { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
  .scene.active .glass-blobs span { animation: blobDrift 10s ease-in-out infinite alternate; }
  @keyframes blobDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(2%, -1.5%) scale(1.06); } }

  #vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 62%, rgba(6,10,30,.16) 100%); }
  #progress { position:absolute; left:0; bottom:0; height:5px; width:0%; z-index:6; background: linear-gradient(90deg,#3457e8,#2fe3c4); }
  #blackout { position:absolute; inset:0; background:#000; opacity:0; z-index:10; pointer-events:none; transition: opacity .7s ease; }
  #blackout.on { opacity:1; }
</style>
</head>
<body>
<div id="stage">

  <!-- SCENE 1 (0:00-0:09) — hook: repeated pain, typed & cleared, corner windows lingering -->
  <section id="sc1" class="scene bg-white active">
    <div class="glass-blobs">
      <span style="width:460px; height:460px; left:-80px; top:-120px; background:#8fb0ff;"></span>
      <span style="width:420px; height:420px; right:-100px; bottom:-100px; background:#2fe3c4;"></span>
    </div>
    <div class="spot"></div>
    <div id="cornerWrap" style="position:absolute; inset:0;"></div>
    <div class="scene-cam">
      <div id="sc1line" class="typewrite line-big on-light" style="min-height:100px;"></div>
      <div id="sc1big" class="line-big on-light" style="margin-top:6px;"></div>
    </div>
  </section>

  <!-- SCENE 2 (0:09-0:18) — brand reveal + tagline + product teaser, one continuous blue backdrop -->
  <section id="sc2" class="scene bg-blue-hero">
    <div class="glass-blobs">
      <span style="width:520px; height:520px; left:-120px; top:-100px; background:#8fb0ff;"></span>
      <span style="width:460px; height:460px; right:-140px; bottom:-120px; background:#2fe3c4;"></span>
      <span style="width:380px; height:380px; right:20%; top:-160px; background:#3457e8;"></span>
    </div>
    <div class="product-tag" id="sc2tag">Pensé pour les équipes pastorales</div>
    <div class="scene-cam">
      <div id="sc2line" class="typewrite line-big on-light" style="min-height:90px;"></div>
      <div class="brand-row" id="sc2brand" style="margin-top:8px;"><div class="brand-mark-lg pulse" id="sc2mark">D<span class="spark-badge" id="sc2spark"></span></div><div class="wordmark" id="sc2word" style="color:#0c1130;">Doxha Church</div></div>
      <div id="sc2tagline" class="typewrite line-sub on-light" style="margin-top:18px; color:rgba(12,17,48,.62);"></div>
      <div class="rise-wrap" style="margin-top:38px;">
        <div class="rise" id="sc2rise"><div id="sc2host"></div></div>
      </div>
    </div>
  </section>

  <!-- SCENE 4 (0:20-0:45) — rapid screenshots -->
  <section id="sc4" class="scene bg-alt">
    <div class="glass-blobs">
      <span style="width:480px; height:480px; left:-100px; bottom:-140px; background:#3457e8;"></span>
      <span style="width:420px; height:420px; right:-120px; top:-100px; background:#2fe3c4;"></span>
      <span style="width:340px; height:340px; left:30%; top:-180px; background:#8fb0ff;"></span>
    </div>
    <div class="spot"></div>
    <div class="scene-cam">
      <div id="sc4line" class="typewrite line-mid on-light" style="margin-bottom:30px; min-height:56px;"></div>
      <div class="rise-wrap">
        <div class="rise" id="sc4rise"><div id="sc4host" style="position:relative;">
          <div id="sc4content"></div>
          <div class="fake-cursor" id="sc4cursor"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3l14 8-6 1.5L11 19 5 3Z" fill="#14171f" stroke="#fff" stroke-width="1"/></svg></div>
          <div class="click-ring" id="sc4ring"></div>
        </div></div>
      </div>
    </div>
  </section>

  <!-- SCENE 5 (0:45-0:50) — CTA end card -->
  <section id="sc5" class="scene bg-navy">
    <div class="spot"></div>
    <div class="scene-cam">
      <div class="brand-row" id="sc5brand"><div class="brand-mark-lg pulse" style="width:88px; height:88px; border-radius:24px; font-size:44px;">D<span class="spark-badge" id="sc5spark" style="width:28px; height:28px; top:-10px; right:-10px;"></span></div><div class="wordmark">Doxha Church</div></div>
      <div class="cta-line" id="sc5cta">Essai gratuit — 14 jours · doxhachurch.com</div>
    </div>
  </section>

  <div id="vignette"></div>
  <div id="progress"></div>
  <div id="blackout"></div>
</div>

<script>
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

  document.querySelectorAll('.scene .spot').forEach(spot => {
    const dark = spot.closest('.scene').classList.contains('bg-navy');
    const c1 = dark ? 'rgba(255,255,255,.07)' : 'rgba(52,87,232,.16)';
    const c2 = dark ? 'rgba(255,255,255,.05)' : 'rgba(47,227,196,.14)';
    spot.innerHTML = `<svg viewBox="0 0 1920 1080" fill="none">
      <circle cx="440" cy="540" r="640" stroke="${c1}" stroke-width="1.5"/>
      <circle cx="1480" cy="540" r="640" stroke="${c2}" stroke-width="1.5"/>
    </svg>`;
  });

  const SPARKLE = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6Z" fill="currentColor"/></svg>';
  document.querySelectorAll('.spark-badge').forEach(s => s.innerHTML = SPARKLE);

  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // typewriter: smooth character-by-character reveal with a blinking cursor — the reference's primary text style
  function typewrite(container, text, msPerChar, accentWords) {
    const ranges = [];
    (accentWords || []).forEach(w => { const idx = text.indexOf(w); if (idx >= 0) ranges.push([idx, idx + w.length]); });
    ranges.sort((a, b) => a[0] - b[0]);
    container.innerHTML = '<span class="tw-text"></span><span class="tw-cursor"></span>';
    const textSpan = container.querySelector('.tw-text');
    const cursor = container.querySelector('.tw-cursor');
    const onDarkScene = !!container.closest('.bg-navy') && !container.classList.contains('on-light');
    cursor.style.background = onDarkScene ? '#2fe3c4' : '#3457e8';
    cursor.style.height = '.95em';
    const total = text.length;
    return new Promise(resolve => {
      let i = 0;
      function render() {
        const shown = text.slice(0, i);
        if (!ranges.length) { textSpan.textContent = shown; return; }
        let html = '', idx = 0;
        for (const [s, e] of ranges) {
          if (idx < s) html += escapeHtml(shown.slice(idx, Math.min(s, shown.length)));
          if (shown.length > s) html += `<span class="tw-accent">${escapeHtml(shown.slice(s, Math.min(e, shown.length)))}</span>`;
          idx = e;
        }
        if (idx < shown.length) html += escapeHtml(shown.slice(idx));
        textSpan.innerHTML = html;
      }
      (function tick() {
        render();
        i++;
        if (i <= total) setTimeout(tick, msPerChar);
        else setTimeout(resolve, 380);
      })();
    });
  }

  function buildup(container, text, stepMs, accentWords) {
    accentWords = accentWords || [];
    const words = text.split(' ');
    return new Promise(resolve => {
      words.forEach((w, i) => {
        setTimeout(() => {
          const span = el('span', 'bw' + (accentWords.includes(w.replace(/[.,?!]/g,'')) ? ' accent' : ''), w + (i < words.length - 1 ? '&nbsp;' : ''));
          container.appendChild(span);
          requestAnimationFrame(() => requestAnimationFrame(() => span.classList.add('in')));
          if (i === words.length - 1) setTimeout(resolve, 500);
        }, i * stepMs);
      });
    });
  }

  // ---- zoom-through match-cut: the camera rushes into a focal element until it fills the frame, then the next screen arrives already zoomed and settles ----
  const SCREEN_FROM = 'perspective(1700px) rotateX(4deg) rotateY(-3.2deg) scale(1)';
  async function zoomCutTo(content, focusSelector, buildNextFn) {
    const oldScreen = content.querySelector('.app-screen');
    if (oldScreen) {
      const frozen = getComputedStyle(oldScreen).transform;
      oldScreen.style.transform = frozen === 'none' ? SCREEN_FROM : frozen;
      oldScreen.style.animation = 'none';
      const focusEl = focusSelector ? oldScreen.querySelector(focusSelector) : null;
      if (focusEl) {
        const sRect = oldScreen.getBoundingClientRect();
        const fRect = focusEl.getBoundingClientRect();
        const ox = ((fRect.left + fRect.width / 2 - sRect.left) / sRect.width) * 100;
        const oy = ((fRect.top + fRect.height / 2 - sRect.top) / sRect.height) * 100;
        oldScreen.style.transformOrigin = `${ox}% ${oy}%`;
        const link = document.getElementById('sc4ring');
        link.style.left = (fRect.left - sRect.left + fRect.width / 2) + 'px';
        link.style.top = (fRect.top - sRect.top + fRect.height / 2) + 'px';
      } else {
        oldScreen.style.transformOrigin = '50% 50%';
      }
      void oldScreen.offsetWidth;
      oldScreen.style.transition = 'transform .48s cubic-bezier(.6,0,.9,1), filter .48s ease, opacity .48s ease .1s';
      requestAnimationFrame(() => {
        oldScreen.style.transform = oldScreen.style.transform + ' scale(6.5)';
        oldScreen.style.filter = 'blur(30px)';
        oldScreen.style.opacity = '0';
      });
      await wait(460);
    }
    content.innerHTML = buildNextFn();
    const fresh = content.querySelector('.app-screen');
    fresh.style.animation = 'none';
    fresh.style.transformOrigin = 'center center';
    fresh.style.transform = 'perspective(1700px) rotateX(4deg) rotateY(-3.2deg) scale(2.4)';
    fresh.style.filter = 'blur(22px)';
    fresh.style.opacity = '0';
    fresh.style.transition = 'none';
    void fresh.offsetWidth;
    fresh.style.transition = 'transform .52s cubic-bezier(.16,1,.3,1), filter .5s ease, opacity .4s ease';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fresh.style.transform = SCREEN_FROM;
      fresh.style.filter = 'blur(0)';
      fresh.style.opacity = '1';
    }));
    await wait(540);
    fresh.style.transition = 'none';
    fresh.style.animation = 'screenPush 3.5s cubic-bezier(.22,.08,.32,1) forwards';
    return fresh;
  }

        inner.style.opacity = '0'; inner.style.transition = 'opacity .5s ease';
        rise.classList.add('in');
        requestAnimationFrame(() => requestAnimationFrame(() => { inner.style.opacity = '1'; }));
      } else {
        await zoomCutTo(content, SC4_SEQUENCE[i - 1].focus, step.build);
      }
      await new Promise(r => setTimeout(r, 200));
      clearEl(lineEl);
      await typewrite(lineEl, step.text, step.speed);
      const holdP = new Promise(r => setTimeout(r, step.hold));
      const interactP = step.interact ? step.interact(content) : Promise.resolve();
      await Promise.all([holdP, interactP]);
    }
    cursorHide();
  }

  function scene5() {
    show('sc5');
    setTimeout(() => document.getElementById('sc5brand').classList.add('in'), 150);
    setTimeout(() => document.getElementById('sc5spark').classList.add('in'), 500);
    setTimeout(() => document.getElementById('sc5cta').classList.add('in'), 700);
  }

  const TOTAL_MS = 50000;
  (async () => {
    await scene1();
    await new Promise(r => setTimeout(r, 500));
    await scene2();
    document.getElementById('blackout').classList.add('on');
    await new Promise(r => setTimeout(r, 600));
    document.getElementById('blackout').classList.remove('on');
    await scene4();
    await new Promise(r => setTimeout(r, 300));
    scene5();
    setTimeout(() => document.getElementById('blackout').classList.add('on'), 4500);
  })();

  const progressEl = document.getElementById('progress');
  const t0 = performance.now();
  function tickProgress(now) {
    const pct = Math.min(100, ((now - t0) / TOTAL_MS) * 100);
    progressEl.style.width = pct + '%';
    if (pct < 100) requestAnimationFrame(tickProgress);
  }
  requestAnimationFrame(tickProgress);
</script>
</body>
</html>
